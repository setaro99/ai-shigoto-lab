title: AI仕事術ラボ
description: 事務・ビジネスの「今日の仕事」をAIで短くする実践ハウツー。コピペで使えるプロンプト付きで配信中。
author: イイヅカ ミナト
lang: ja
timezone: Asia/Tokyo

url: "https://setaro99.github.io"
baseurl: "/ai-shigoto-lab"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- 検索エンジンへのサイト登録用（2026-08-22 準備） ---
# このサイトは github.io のサブディレクトリ配下（/ai-shigoto-lab）にあり外部リンクも1本も無いため、
# Google Search Console に登録しないとクローラーにほぼ発見されない。
# なお robots.txt はドメイン直下（setaro99.github.io/robots.txt）に置かないと無視される仕様で、
# そこは別リポジトリの管轄のためこのリポジトリからは設置できない。所有権確認は「HTMLタグ方式」を使う。
#
# 使い方: Search Console が表示する
#   <meta name="google-site-verification" content="XXXXXXXX" />
# の content の値だけを下の行のコメントを外して貼れば、jekyll-seo-tag が全ページに出力する。
#
# google_site_verification: ここに値を貼る
# webmaster_verifications:
#   bing: ここに値を貼る

minima:
  date_format: "%Y年%m月%d日"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  # デフォルトOGP画像。jekyll-seo-tagはsite直下のimageキーを見ないため、
  # 全ページ(投稿・固定ページ)にdefaultsでimageを注入する。個別記事のfront matterで
  # image: を指定すればそちらが優先される。baseurl込みの絶対URLに自動変換される。
  - scope:
      path: ""
    values:
      image: /assets/ogp-default.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
